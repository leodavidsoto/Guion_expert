# =============================================================
# Guion_expert — Config per-expert del LLM
# =============================================================
# Pipeline v2 con mejoras M1-M8. Ahora tiene 9 experts:
# 7 originales + bible_writer (M1) + continuity_qa (M3).
#
# Heurísticas de temperatura:
#   - 0.9   : creatividad libre (concepto, bible_writer)
#   - 0.7   : balanceado (arquitecto, escaletista)
#   - 0.85  : expresividad dramática (dialoguista)
#   - 0.2   : determinista (clasificador)
#   - 0.3-0.4: técnico estructurado (director_flow, localizador, continuity_qa)
#
# M8 — Prompt Caching: los experts con system prompts largos y reutilizados
# por escena (dialoguista, director_flow) son los mejores candidatos para
# cache_system_prompt=True en el call site.
# =============================================================

experts:

  clasificador:
    description: "Clasifica formato y estructura narrativa. Emite confidence_score calibrado (M6)."
    temperature: 0.2
    max_tokens: 1024

  bible_writer:
    description: "M1 — Genera el Story Bible global (personajes, ADN visual, ADN sonoro) via tool use."
    temperature: 0.85
    max_tokens: 4096

  concepto:
    description: "Genera concepto, logline y tema central. Alta creatividad."
    temperature: 0.9
    max_tokens: 2048

  arquitecto:
    description: "Construye la estructura con los 15 beats de Save the Cat parametrizados."
    temperature: 0.7
    max_tokens: 4096

  escaletista:
    description: "Expande la estructura en una lista de escenas filmables."
    temperature: 0.7
    max_tokens: 4096

  dialoguista:
    description: "Escribe cada escena con diálogo, SBS persona-check y bloque sonoro. Cache-friendly."
    temperature: 0.85
    max_tokens: 4096

  localizador:
    description: "Genera prompts FLUX técnicos basados en el ADN visual del Story Bible (M4 simplificado)."
    temperature: 0.4
    max_tokens: 512

  director_flow:
    description: "Genera Master Stack JSON via tool use. Two-pass: genera + verifica contra Story Bible (M5)."
    temperature: 0.3
    max_tokens: 2048

  continuity_qa:
    description: "M3 — Auditor adversario. Detecta discontinuidades, disonancias y drift visual/sonoro."
    temperature: 0.2
    max_tokens: 2048
