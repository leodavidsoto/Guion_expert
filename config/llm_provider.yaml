# =============================================================
# Guion_expert — Config per-expert del LLM
# =============================================================
# Cada uno de los 7 experts del pipeline puede tener temperature
# y max_tokens distintos según la naturaleza de su output.
#
# Si un expert no está en esta lista, o si le falta algún campo,
# se usan los defaults globales de .env:
#   - CLAUDE_MAX_TOKENS    (default 4096)
#   - CLAUDE_TEMPERATURE   (default 0.7)
#
# Heurísticas:
#   - temperature alta (0.8–0.9): creatividad libre (concepto, diálogos)
#   - temperature media (0.6–0.7): balanceado (arquitecto, escaletista)
#   - temperature baja (0.2–0.4): output determinista y estructurado
#     (clasificador, prompts técnicos)
#   - max_tokens grande: outputs largos (escenas con diálogo, estructura)
#   - max_tokens chico: outputs cortos (prompts SD/VEO, clasificación)
# =============================================================

experts:

  clasificador:
    description: "Clasifica formato (corto/medio/largo/serie) y estructura narrativa. Output corto y determinista."
    temperature: 0.2
    max_tokens: 1024

  concepto:
    description: "Genera concepto, logline y tema central. Alta creatividad."
    temperature: 0.9
    max_tokens: 2048

  arquitecto:
    description: "Construye la estructura (3 actos / viaje del héroe / Kishōtenketsu / etc.)."
    temperature: 0.7
    max_tokens: 4096

  escaletista:
    description: "Expande la estructura en una lista de escenas (beat sheet)."
    temperature: 0.7
    max_tokens: 4096

  dialoguista:
    description: "Escribe cada escena con acción y diálogo. Una instancia por escena."
    temperature: 0.85
    max_tokens: 4096

  localizador:
    description: "Genera prompts de Stable Diffusion. Técnico, denso, corto."
    temperature: 0.4
    max_tokens: 512

  director_flow:
    description: "Genera prompts JSON estructurados para VEO/Flow. Output rígido."
    temperature: 0.3
    max_tokens: 1024
